<mat-toolbar color="primary" class="header-toolbar">
  <div class="header-content">
    <div class="app-title">
      <mat-icon class="app-icon">keyboard</mat-icon>
      <h1>{{ appName }}</h1>
    </div>
    <div class="app-info">
      <span class="version">v{{ version }}</span>
      <span class="developer">by {{ developer }}</span>
      <span class="copyright">© {{ currentYear }}</span>
    </div>
  </div>
</mat-toolbar>
